services:
  mysql:
    image: mysql:8.4
    container_name: szr3-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: szr3
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - szr3_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  clamav:
    image: clamav/clamav:stable
    container_name: szr3-clamav
    restart: unless-stopped
    profiles: ["security"]
    ports:
      - "127.0.0.1:3310:3310"

volumes:
  szr3_mysql_data:
